// libvlcrs-android — an *independent* Gradle project.
//
// It is deliberately not part of the VLC for Android build (root settings.gradle):
// it pins its own AGP/Kotlin versions, has no dependency on the libvlc AARs and
// only builds the arm64-v8a release variant, so it can be built in CI without
// bootstrapping VLC's contribs.
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "libvlcrs-android"

include ':api'
include ':demo'
